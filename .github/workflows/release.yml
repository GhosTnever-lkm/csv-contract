name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate tag and version
        run: python -c "import os; from pathlib import Path; assert os.environ['GITHUB_REF_NAME'] == 'v' + Path('VERSION').read_text().strip()"
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install build
      - run: python -m build
      - name: Verify built package and example
        run: |
          python -m pip install --force-reinstall dist/*.whl
          csv-contract --version
          csv-contract examples/valid.csv --contract examples/contract.json
      - name: Write checksums
        run: python -c "import hashlib; from pathlib import Path; files=sorted(p for p in Path('dist').iterdir() if p.is_file()); Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files), encoding='utf-8')"
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: dist/*
