name: Check
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install .
      - run: csv-contract --version
      - run: csv-contract examples/valid.csv --contract examples/contract.json
      - name: Check package version
        run: python -c "from importlib.metadata import version; from pathlib import Path; assert version('csv-contract') == Path('VERSION').read_text().strip()"
